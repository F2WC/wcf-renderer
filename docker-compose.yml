x-node-base: &node-base
  image: node:24-alpine
  environment:
    NODE_ENV: development
    CHOKIDAR_USEPOLLING: 'true'
    CHOKIDAR_INTERVAL: '200'
  volumes:
    - ./:/app
    - root_node_modules:/app/node_modules
    - sdk_node_modules:/app/packages/sdk/node_modules
    - shell_package_node_modules:/app/packages/shell/node_modules
    - vite_react_node_modules:/app/packages/vite-plugin-wcf-react/node_modules
    - shell_app_node_modules:/app/playground/shell/node_modules
    - mfe_vue_node_modules:/app/playground/mfe-vue-one/node_modules
    - mfe_react_node_modules:/app/playground/mfe-react-one/node_modules

services:
  # One-shot: installs the whole npm workspace into the shared root_node_modules
  # volume. All other services wait for this to complete successfully.
  installer:
    <<: *node-base
    working_dir: /app
    command: sh -lc "npm install --no-audit --no-fund"

  sdk:
    <<: *node-base
    working_dir: /app/packages/sdk
    command: sh -lc "npm run dev"
    depends_on:
      installer:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'test -f /app/packages/sdk/dist/index.js']
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 10s

  shell-package:
    <<: *node-base
    working_dir: /app/packages/shell
    command: sh -lc "npm run dev"
    depends_on:
      sdk:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'test -f /app/packages/shell/dist/index.js']
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 10s

  vite-plugin-wcf-react:
    <<: *node-base
    working_dir: /app/packages/vite-plugin-wcf-react
    command: sh -lc "npm run dev"
    depends_on:
      installer:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'test -f /app/packages/vite-plugin-wcf-react/dist/index.js']
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 10s

  mfe-vue-one:
    <<: *node-base
    working_dir: /app/playground/mfe-vue-one
    command: sh -lc "npm run dev -- --host 0.0.0.0"
    depends_on:
      sdk:
        condition: service_healthy

  mfe-react-one:
    <<: *node-base
    working_dir: /app/playground/mfe-react-one
    command: sh -lc "npm run dev -- --host 0.0.0.0"
    depends_on:
      sdk:
        condition: service_healthy
      vite-plugin-wcf-react:
        condition: service_healthy

  shell-app:
    <<: *node-base
    working_dir: /app/playground/shell
    command: sh -lc "npm run dev -- --host 0.0.0.0"
    depends_on:
      shell-package:
        condition: service_healthy
      mfe-vue-one:
        condition: service_started
      mfe-react-one:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    ports:
      - '8080:8080'
    volumes:
      - ./playground/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./playground/caddy/srv:/srv:ro
    depends_on:
      - shell-app
      - mfe-vue-one
      - mfe-react-one

volumes:
  root_node_modules:
  sdk_node_modules:
  shell_package_node_modules:
  vite_react_node_modules:
  shell_app_node_modules:
  mfe_vue_node_modules:
  mfe_react_node_modules:
